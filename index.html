<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121816;--card:#1b2422;--ink:#e8efed;--mut:#93a19e;--ac:#2dd4bf;--ac2:#fbbf24;--bad:#f87171;--ok:#4ade80;--ln:#2c3835}}
:root[data-theme=dark]{--bg:#121816;--card:#1b2422;--ink:#e8efed;--mut:#93a19e;--ac:#2dd4bf;--ac2:#fbbf24;--bad:#f87171;--ok:#4ade80;--ln:#2c3835}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}

header{padding:14px 18px 0;max-width:1200px;margin:auto}h1{font-size:20px;margin:0}h1 small{display:block;font-size:12.5px;font-weight:400;color:var(--mut)}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 18px;max-width:1200px;margin:auto}

.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}

.pos{color:var(--ok)}.neg{color:var(--bad)}.note{font-size:12.5px;color:var(--mut)}
label{display:block;font-size:13px}label small{color:var(--mut);display:block;font-size:11.5px}
input,select{width:100%;padding:6px 8px;border:1px solid var(--ln);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;min-width:60px}

.btn{border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}.btn.o{background:none;color:var(--ac)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--ln)}.tag.bad{background:var(--bad);color:#fff}.tag.ok{background:var(--ok);color:#fff}.tag.w{background:var(--ac2);color:#000}

@media(max-width:700px){main,header,nav{padding-left:12px;padding-right:12px}input,select,textarea{font-size:16px;min-height:42px}input[type=checkbox]{min-height:0;height:24px;width:24px!important}.btn,nav button{min-height:42px;margin:2px 0}
nav{position:sticky;top:0;background:var(--bg);z-index:5}.k{font-size:19px}.c{padding:11px}.g{grid-template-columns:1fr 1fr}
.stk,.stk tbody,.stk tr,.stk td{display:block;width:100%}.stk tr:first-child{display:none}.stk tr{border:1px solid var(--ln);border-radius:10px;padding:8px;margin-bottom:10px}
.stk td{border:0;text-align:left;display:flex;align-items:center;gap:8px;padding:3px 0}.stk td::before{content:attr(data-l);width:74px;flex:none;color:var(--mut);font-size:12px}.stk td input,.stk td select{flex:1;width:auto;min-width:0}}
</style></head><body>
<header><h1>School Van Profit Optimizer<small>Decision-support for a small school-van operator · all figures in LKR · estimates, not guarantees</small></h1></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const LS='svpo_v1',TABS=['Dashboard','Vehicle','Students','Routes','Capacity','Scenarios','Economics'];
const fmt=n=>Math.round(n).toLocaleString('en-LK'),L=n=>'LKR '+fmt(n),f1=n=>(Math.round(n*10)/10).toFixed(1);
const cls=n=>n>=0?'pos':'neg';
function demo(){const st=[];
 for(let i=0;i<8;i++)st.push({name:'Student '+(i+1),area:'Obeysekarapura',loc:'',school:'Muslim Ladies College',fee:6500,am:'06:30',pm:'14:30',on:1});
 for(let i=8;i<16;i++)st.push({name:'Student '+(i+1),area:'Rajagiriya',loc:'',school:'Muslim Ladies College',fee:6500,am:'06:30',pm:'14:30',on:1});
 return{sel:21,w:{fee:0,fuel:0,km:0,seats:0},sc:[16,18,21],cap:21,
 v:{name:'Nissan Caravan / Urvan-style (ASSUMED preset)',year:1996,seats:16,legal:21,L:4.8,W:1.7,H:1.35,area:8.2,tare:1800,gvw:2900,fuel:'Diesel',kmpl:7,price:407,maint:14167,ins:0,driver:0,other:1375,seatW:.35,pitch:.66,aisle:.3,door:.65,exit:.3,bag:.05,kg:55,dkg:75,perSeat:100000,days:22,speed:24,board:1.5,maxRoute:37.5,maxDay:6},
 areas:['Obeysekarapura','Rajagiriya'],schools:['Muslim Ladies College'],
 dist:[{a:'Depot',b:'Obeysekarapura',km:1},{a:'Obeysekarapura',b:'Muslim Ladies College',km:8.1}],
 students:st}}
let S;try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}S=S||demo();let tab=0;
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const dist=(a,b)=>{if(a===b)return 0;const e=S.dist.find(d=>(d.a===a&&d.b===b)||(d.a===b&&d.b===a));return e?+e.km:0};
function missingDist(){const need=new Set(),bySc={};
 S.students.filter(s=>s.on).forEach(s=>{need.add('Depot|'+s.area);need.add(s.area+'|'+s.school);(bySc[s.school]=bySc[s.school]||new Set()).add(s.area)});
 Object.values(bySc).forEach(set=>{const arr=[...set];for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)need.add(arr[i]+'|'+arr[j])});
 const miss=[];need.forEach(k=>{const[a,b]=k.split('|');if(a!==b&&!S.dist.find(d=>(d.a===a&&d.b===b)||(d.a===b&&d.b===a)))miss.push(a+' → '+b)});return miss}
function tour(list,sc){let d=0,c='Depot';list.forEach(s=>{d+=dist(c,s.area);c=s.area});return d+dist(c,sc)}
function build(N){const v=S.v,out=[],by={};
 S.students.filter(s=>s.on).forEach(s=>(by[s.school]=by[s.school]||[]).push(s));
 for(const sc in by){let pool=by[sc].slice();
  while(pool.length){pool.sort((a,b)=>dist(b.area,sc)-dist(a.area,sc));const r=[pool.shift()];
   while(r.length<N&&pool.length){const l=r[r.length-1];let bi=0,bd=1e9;pool.forEach((s,i)=>{const d=dist(l.area,s.area);if(d<bd){bd=d;bi=i}});
    const t=[...r,pool[bi]];if(tour(t,sc)/v.speed*60+t.length*v.board>v.maxRoute)break;r.push(pool.splice(bi,1)[0])}
   out.push({sc,st:r})}}
 return out}
function evalN(N,o={}){const v=S.v,fm=1+(o.fee||0)/100,price=o.fuel||v.price,ex=Math.max(0,N-v.seats),kmpl=v.kmpl*(1-.006*ex);
 let R=build(N).map(r=>{const n=r.st.length,tk=tour(r.st,r.sc),km=2*tk,hrs=km/v.speed+2*n*v.board/60;
  const rev=r.st.reduce((a,s)=>a+s.fee,0)*fm*(o.stu||1),fd=km/kmpl*price;
  return{...r,n,km,hrs,mins:tk/v.speed*60+n*v.board,rev,fd,contrib:rev-fd*v.days,ph:(rev-fd*v.days)/v.days/hrs,areas:[...new Set(r.st.map(s=>s.area))]}});
 R.sort((a,b)=>b.ph-a.ph);let h=0;R.forEach(r=>{r.drop=h+r.hrs>v.maxDay;if(!r.drop)h+=r.hrs});
 const K=R.filter(r=>!r.drop),xk=o.km||0,km=K.reduce((a,r)=>a+r.km,0)+xk,hrs=h+xk/v.speed,stu=K.reduce((a,r)=>a+r.n,0),
 rev=K.reduce((a,r)=>a+r.rev,0),fuel=km/kmpl*price*v.days,fixed=v.maint*(o.mt||1)*(1+.015*ex)+v.ins+v.driver*(o.drv||1)+v.other,cost=fuel+fixed,profit=rev-cost,
 all=R.reduce((a,r)=>a+r.n,0),avgFee=stu?rev/stu:0,vps=stu?fuel/stu:0;
 K.forEach(r=>{r.cost=r.fd*v.days+fixed*r.hrs/(hrs||1);r.profit=r.rev-r.cost});
 return{R,K,km,hrs,stu,all,rev,fuel,fixed,cost,profit,ph:hrs?profit/v.days/hrs:0,rph:hrs?rev/v.days/hrs:0,
  filled:K.length?stu/(K.length*N):0,avgMin:K.length?K.reduce((a,r)=>a+r.mins,0)/K.length:0,
  be:avgFee>vps?Math.ceil(fixed/(avgFee-vps)):Infinity,beRev:fixed/(1-(rev?fuel/rev:0)),beH:hrs&&rev>fuel?fixed/((rev-fuel)/hrs)/v.days:Infinity,kmm:km*v.days,ex}}
function chk(N){const v=S.v,ab=Math.min(4,Math.floor((v.W-v.aisle)/v.seatW)),rows=Math.ceil((N-1)/Math.max(ab,1)),bag=N*v.bag/v.W,need=v.door+rows*v.pitch+bag+v.exit,
 pay=N*v.kg+v.dkg,cap=v.gvw-v.tare,f=[];
 if(ab<2)f.push('Van too narrow for seats + minimum aisle');if(need>v.L)f.push('Seats + door + bags + exit need '+f1(need)+' m; only '+f1(v.L)+' m available');
 if(pay>cap)f.push('Payload '+fmt(pay)+' kg exceeds allowance '+fmt(cap)+' kg');
 return{ab,rows,bag,need,pay,cap,f,ok:!f.length,legal:N<=v.legal}}
function svgBar(lab,ser,w=460,h=190){const m=Math.max(1,...ser.flatMap(s=>s.v.map(Math.abs))),mn=Math.min(0,...ser.flatMap(s=>s.v)),rg=m-mn,z=150-(-mn/rg)*120,bw=(w-40)/lab.length,sw=bw*.8/ser.length;
 let o=`<svg viewBox="0 0 ${w} ${h}" width="100%"><line x1="30" x2="${w}" y1="${z}" y2="${z}" stroke="#8886"/>`;
 lab.forEach((l,i)=>{ser.forEach((s,j)=>{const y=s.v[i]/rg*120,x=32+i*bw+j*sw;o+=`<rect x="${x}" y="${y>=0?z-y:z}" width="${sw-1}" height="${Math.abs(y)}" fill="${s.c}" rx="2"><title>${s.n}: ${fmt(s.v[i])}</title></rect>`});o+=`<text x="${32+i*bw+bw*.4}" y="${h-6}" font-size="10" text-anchor="middle">${l}</text>`});
 return o+'</svg><div class="note">'+ser.map(s=>`<span style="color:${s.c}">■</span> ${s.n}`).join(' &nbsp; ')+'</div>'}
function van(N){const v=S.v,c=chk(N),s=110,p=14,cab=1,ab=Math.max(2,c.ab),W=v.W*s,X=m=>p+m*s;let o=`<svg viewBox="0 0 ${p*2+(cab+v.L)*s} ${W+p*2+34}" width="100%"><rect x="${p}" y="${p}" width="${(cab+v.L)*s}" height="${W}" rx="26" fill="none" stroke="currentColor" stroke-width="2"/>`;
 o+=`<rect x="${X(.15)}" y="${p+8}" width="${.5*s}" height="${.45*s}" rx="6" fill="#64748b"/><text x="${X(.15)}" y="${p+W-4}" font-size="11">Driver</text>`;
 let n=1;o+=`<rect x="${X(.15)}" y="${p+W-.5*s-8}" width="${.5*s}" height="${.4*s}" rx="6" fill="#0f766e"/>`;
 const dx=cab,rx=dx+v.door;o+=`<line x1="${X(dx)}" x2="${X(rx)}" y1="${p+W}" y2="${p+W}" stroke="#15803d" stroke-width="6"/><text x="${X(dx)}" y="${p+W+16}" font-size="11">Side door (access)</text>`;
 const ay=(v.W-ab*v.seatW-0)/1;for(let r=0;n<N;r++){for(let k=0;k<ab&&n<N;k++){const y=k<ab/2?p+(k*v.seatW)*s+ (v.W-ab*v.seatW-v.aisle)/2*s:p+((k*v.seatW+v.aisle))*s+(v.W-ab*v.seatW-v.aisle)/2*s,x=X(rx+r*v.pitch);const out=rx+(r+1)*v.pitch>cab+v.L;
  o+=`<rect x="${x}" y="${y}" width="${(v.pitch-.14)*s}" height="${v.seatW*s-3}" rx="4" fill="${out?'#b91c1c':'#0f766e'}" opacity=".85"/>`;n++}}
 const bx=X(rx+c.rows*v.pitch);o+=`<rect x="${bx}" y="${p+8}" width="${c.bag*s}" height="${W-16}" fill="#d9770655" stroke="#d97706" stroke-dasharray="4"/><text x="${bx+2}" y="${p+W/2}" font-size="10">Bags</text>`;
 o+=`<line x1="${X(cab+v.L)}" x2="${X(cab+v.L)}" y1="${p+10}" y2="${p+W-10}" stroke="#d97706" stroke-width="6"/><text x="${X(cab+v.L)-70}" y="${p+W+16}" font-size="11">Emergency exit</text>`;
 return o+`<text x="${p+4}" y="${p+W+30}" font-size="11">Driver → seats → aisle → doors → exit → bags · illustrative only, not an engineering drawing</text></svg>`}
function sankey(e){const v=S.v,K=n=>Math.round(n/1000)+'k',a={};e.K.forEach(r=>r.st.forEach(s=>a[s.area]=(a[s.area]||0)+s.fee));
 const T=Math.max(e.rev,e.cost)||1,pal=['#0f766e','#14b8a6','#0d9488','#2dd4bf','#5eead4','#115e59'];
 const Lf=Object.entries(a).sort((x,y)=>y[1]-x[1]).map((x,i)=>({n:x[0],v:x[1],c:pal[i%6]}));if(e.profit<0)Lf.push({n:'Shortfall',v:-e.profit,c:'#b91c1c'});
 const Rt=[{n:'Fuel',v:e.fuel,c:'#d97706'},{n:'Driver',v:v.driver,c:'#f59e0b'},{n:'Maintenance',v:e.fixed-v.ins-v.driver-v.other,c:'#b45309'},{n:'Insurance',v:v.ins,c:'#fbbf24'},{n:'Other',v:v.other,c:'#a16207'}];if(e.profit>0)Rt.push({n:'Profit',v:e.profit,c:'#2563eb'});
 const H=300,W=560,g=12,x0=118,x1=270,x2=420,nw=12,F=x=>x.filter(n=>n.v>0.5),LA=F(Lf),RB=F(Rt),k=(H-20-g*(Math.max(LA.length,RB.length)-1))/T;
 const place=arr=>{let y=(H-(arr.reduce((t,n)=>t+n.v*k,0)+g*(arr.length-1)))/2;return arr.map(n=>{const o={...n,y,h:n.v*k};y+=o.h+g;return o})},A=place(LA),B=place(RB),mh=T*k,my=(H-mh)/2;
 const link=(xa,ya,xb,yb,h,c)=>{const m=(xa+xb)/2;return`<path d="M${xa},${ya}C${m},${ya} ${m},${yb} ${xb},${yb}V${yb+h}C${m},${yb+h} ${m},${ya+h} ${xa},${ya+h}Z" fill="${c}" opacity=".35"/>`};
 let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px">`,cy=my;
 A.forEach(n=>{o+=link(x0+nw,n.y,x1,cy,n.h,n.c);cy+=n.h});cy=my;B.forEach(n=>{o+=link(x1+nw,cy,x2,n.y,n.h,n.c);cy+=n.h});
 A.forEach(n=>o+=`<rect x="${x0}" y="${n.y}" width="${nw}" height="${n.h}" fill="${n.c}"/><text x="${x0-6}" y="${n.y+n.h/2+4}" font-size="11.5" text-anchor="end">${n.n} ${K(n.v)}</text>`);
 o+=`<rect x="${x1}" y="${my}" width="${nw}" height="${mh}" fill="#64748b"/><text x="${x1+nw/2}" y="${my-6}" font-size="11.5" text-anchor="middle" font-weight="600">Money in ${K(T)}</text>`;
 B.forEach(n=>o+=`<rect x="${x2}" y="${n.y}" width="${nw}" height="${n.h}" fill="${n.c}"/><text x="${x2+nw+6}" y="${n.y+n.h/2+4}" font-size="11.5">${n.n} ${K(n.v)}</text>`);
 return`<div class="c"><h3>Where the money flows <span class="note">per month, LKR thousands</span></h3>${o}</svg><div class="note">Student fees by pickup area → total money in → what each cost takes and what is left as profit. ${e.profit<0?'<b class=neg>Costs exceed fees: the red "Shortfall" is the monthly loss.</b> ':''}Estimate from the current routes.</div></div>`}
const inp=(p,lab,h='',st='any')=>{const val=p.split('.').reduce((a,k)=>a[k],S);return`<label>${lab}<small>${h}</small><input data-p="${p}" ${typeof val==='number'?`type="number" step="${st}"`:''} value="${val}"></label>`};
const kpi=(l,v,s='',c='')=>`<div class="c"><div class="l">${l}</div><div class="k ${c}">${v}</div><div class="note">${s}</div></div>`;
const sel=(cur,opts,attr)=>`<select ${attr}>${opts.map(o=>`<option ${o==cur?'selected':''}>${o}</option>`).join('')}</select>`;
const areas=()=>S.areas,schools=()=>S.schools;
const views={
Dashboard(){const e=evalN(S.v.seats),u=e.all-e.stu;return`<div class="g">${kpi('Money coming in / month','Monthly revenue',L(e.rev))}${kpi('Money going out / month','Monthly costs',L(e.cost))}${kpi('Left over each month','Monthly profit',L(e.profit),'',cls(e.profit))}${kpi('Students on the van','Active students',e.stu+' served'+(u?` · <b class=neg>${u} cannot fit in the day</b>`:''))}${kpi('Seats currently filled','Vehicle utilization',f1(e.filled*100)+'%','avg students per run ÷ seats')}${kpi('Profit per hour of driving','Profit / vehicle-hour',L(e.ph),'estimate')}${kpi('Average route duration',Math.round(e.avgMin)+' min','one-way morning run')}${kpi('Students needed to cover costs','Break-even students',isFinite(e.be)?e.be:'—','at current average fee')}</div>
${sankey(e)}<div class="g2"><div class="c"><h3>Monthly revenue / cost / profit</h3>${svgBar(['Now'],[{n:'Revenue',v:[e.rev],c:'#0f766e'},{n:'Cost',v:[e.cost],c:'#d97706'},{n:'Profit',v:[e.profit],c:'#2563eb'}])}</div>
<div class="c"><h3>Students per route (density)</h3>${svgBar(e.K.map((r,i)=>'R'+(i+1)),[{n:'Students',v:e.K.map(r=>r.n),c:'#0f766e'}])}<div class="note">Details in Routes. The default demo data is fictional — replace it with your own.</div></div></div>`},
Vehicle(){return`<div class="c"><h3>Vehicle</h3><div class="warn">The Caravan values below are <b>editable assumptions</b>, not verified specs. Enter your registration/legal limits from your documents — this app cannot determine the legal maximum for you.</div><div class="g">${inp('v.name','Vehicle name')}${inp('v.year','Year')}${inp('v.seats','Current seats','passenger seats incl. front')}${inp('v.legal','Permitted seats (your legal limit)','from your registration / authority')}${inp('v.L','Interior length (m)','behind driver row')}${inp('v.W','Interior width (m)')}${inp('v.H','Interior height (m)')}${inp('v.area','Usable floor area (m²)','reference only')}${inp('v.tare','Empty weight (kg)','tare')}${inp('v.gvw','Max loaded weight (kg)','GVW, from registration')}${inp('v.fuel','Fuel type')}${inp('v.kmpl','Fuel use (km per litre)')}${inp('v.price','Fuel price (LKR / litre)','enter today\'s price')}${inp('v.maint','Maintenance (LKR/month)')}${inp('v.ins','Insurance (LKR/month)')}${inp('v.driver','Driver cost (LKR/month)')}${inp('v.other','Other costs (LKR/month)')}</div></div>
<div class="c"><h3>Engineering assumptions</h3><div class="g">${inp('v.seatW','Seat width per child (m)')}${inp('v.pitch','Seat row length (m)','pitch')}${inp('v.aisle','Minimum aisle (m)','hard limit')}${inp('v.door','Door clear zone (m)','hard limit')}${inp('v.exit','Emergency exit clearance (m)','hard limit')}${inp('v.bag','Bag space per student (m²)')}${inp('v.kg','Weight per student + bag (kg)')}${inp('v.dkg','Driver weight (kg)')}${inp('v.perSeat','Conversion cost per added seat (LKR)')}${inp('v.days','School days / month')}${inp('v.speed','Average speed (km/h)')}${inp('v.board','Boarding time per student (min)')}${inp('v.maxRoute','Max one-way route (min)')}${inp('v.maxDay','Max driving hours / day')}</div></div>
<div class="c"><h3>Your data</h3><button class="btn" onclick="if(confirm('Reset to demo data?')){S=demo();save();R()}">Reset demo data</button> <button class="btn o" onclick="ex()">Export</button> <button class="btn o" onclick="im()">Import</button><textarea id="io" placeholder="Export shows JSON here to copy. To import, paste JSON here, then press Import."></textarea></div>`},
Students(){const t=S.students;return`<div class="c"><h3>Students <span class="note">${t.filter(s=>s.on).length} active · fee ${L(t.filter(s=>s.on).reduce((a,s)=>a+s.fee,0))}/month</span></h3><table class="stk"><tr><th>Name</th><th>Pickup area</th><th>Location</th><th>School</th><th>Fee</th><th>AM</th><th>PM</th><th>Active</th><th></th></tr>${t.map((s,i)=>`<tr><td data-l="Name"><input data-s="${i}.name" value="${s.name}"></td><td data-l="Area">${sel(s.area,areas(),`data-s="${i}.area"`)}</td><td data-l="Location"><input data-s="${i}.loc" value="${s.loc}"></td><td data-l="School">${sel(s.school,schools(),`data-s="${i}.school"`)}</td><td data-l="Fee (LKR)"><input data-s="${i}.fee" type="number" value="${s.fee}"></td><td data-l="Morning"><input data-s="${i}.am" value="${s.am}" style="width:70px"></td><td data-l="Afternoon"><input data-s="${i}.pm" value="${s.pm}" style="width:70px"></td><td data-l="Active"><input type="checkbox" data-s="${i}.on" ${s.on?'checked':''} style="width:auto"></td><td data-l=""><button class="btn o" onclick="S.students.splice(${i},1);save();R()">✕</button></td></tr>`).join('')}</table><p><button class="btn" onclick="addS(1)">+ Add student</button> <button class="btn o" onclick="addS(2)">+ Add 2 more in the same area as the last one</button></p></div>
<div class="c"><h3>Areas &amp; schools</h3><div class="g2">
<div><b>Pickup areas</b>${S.areas.map((a,i)=>`<div style="display:flex;gap:6px;margin:4px 0"><input data-area-i="${i}" value="${a}"><button class="btn o" onclick="S.areas.splice(${i},1);save();R()">✕</button></div>`).join('')}<p><button class="btn o" onclick="S.areas.push('New area');save();R()">+ Add area</button></p></div>
<div><b>Schools</b>${S.schools.map((a,i)=>`<div style="display:flex;gap:6px;margin:4px 0"><input data-school-i="${i}" value="${a}"><button class="btn o" onclick="S.schools.splice(${i},1);save();R()">✕</button></div>`).join('')}<p><button class="btn o" onclick="S.schools.push('New school');save();R()">+ Add school</button></p></div>
</div></div>
<div class="c"><h3>Distances (km)</h3><div class="note">Enter each leg's real one-way road distance once — paste straight from Google Maps or Waze, e.g. "Depot to Obeysekarapura: 1 km", "Obeysekarapura to Muslim Ladies College: 8.1 km".</div><table><tr><th>From</th><th>To</th><th>km</th><th></th></tr>${S.dist.map((d,i)=>`<tr><td>${sel(d.a,['Depot',...S.areas,...S.schools],`data-dist="${i}.a"`)}</td><td>${sel(d.b,['Depot',...S.areas,...S.schools],`data-dist="${i}.b"`)}</td><td><input data-dist="${i}.km" type="number" step="0.1" value="${d.km}" style="width:80px"></td><td><button class="btn o" onclick="S.dist.splice(${i},1);save();R()">✕</button></td></tr>`).join('')}</table><p><button class="btn" onclick="S.dist.push({a:'Depot',b:S.areas[0]||'Depot',km:0});save();R()">+ Add distance</button></p>
${missingDist().length?`<div class="warn" style="border-color:var(--bad)">Missing distances for: ${missingDist().join(', ')}. Routes will treat these as 0 km until entered.</div>`:''}</div>`},
Routes(){const e=evalN(S.v.seats),miss=missingDist();return`<div class="c"><h3>Proposed routes <span class="note">(${S.v.seats} seats)</span></h3><div class="warn">Routes are built with a transparent <b>nearest-neighbour heuristic</b> (farthest student first, then nearest next stop). They are sensible estimates, <b>not mathematically optimal</b>. If total driving exceeds ${S.v.maxDay} h/day, the least profitable routes are left out.</div>${miss.length?`<div class="warn" style="border-color:var(--bad)">Missing distances (treated as 0 km) — add them in Students: ${miss.join(', ')}</div>`:''}<table><tr><th>Route</th><th>Students</th><th>Revenue/mo</th><th>km/day</th><th>hours/day</th><th>Fuel/day</th><th>Operating cost/mo</th><th>Extra profit vs fuel</th><th>Profit/student</th><th>Profit/hr</th><th>Seats filled</th></tr>${e.R.map((r,i)=>`<tr ${r.drop?'style="opacity:.55"':''}><td>${r.sc}<br><span class="note">${r.areas.join(', ')}</span>${r.drop?' <span class="tag bad">no time</span>':r.n/S.v.seats<.6?' <span class="tag w">underused</span>':''}</td><td>${r.n}</td><td>${fmt(r.rev)}</td><td>${f1(r.km)}</td><td>${f1(r.hrs)}</td><td>${fmt(r.fd)}</td><td>${r.drop?'—':fmt(r.cost)}</td><td>${fmt(r.contrib)}</td><td>${r.drop?'—':fmt(r.profit/r.n)}</td><td>${fmt(r.ph)}</td><td>${Math.round(r.n/S.v.seats*100)}%</td></tr>`).join('')}</table><p class="note">Total ${f1(e.hrs)} h/day of ${S.v.maxDay} h available. Empty seats across runs: ${e.K.length*S.v.seats-e.stu}. A student far from everyone else adds km without adding a neighbour — check "Extra profit vs fuel" per route, and watch density below.</p></div>
<div class="c"><h3>Students per km (route density)</h3>${svgBar(e.R.map((r,i)=>'R'+(i+1)),[{n:'Students per 10 km',v:e.R.map(r=>r.n/r.km*10),c:'#0f766e'}])}</div>`},
Capacity(){const N=S.cap,c=chk(N),e=evalN(N),b=evalN(S.v.seats),rg=[];for(let i=S.v.seats;i<=20;i++)rg.push(i);const E=rg.map(n=>evalN(n));
return`<div class="c"><h3>Seat layout</h3><p>${[14,16,18,20].map(n=>`<button class="btn ${n==N?'':'o'}" onclick="S.cap=${n};save();R()">${n} seats</button>`).join(' ')} <input data-p="cap" type="number" value="${N}" style="width:80px" title="custom"></p>${van(N)}
<p>${c.ok?'<span class="tag ok">Fits physical limits</span>':'<span class="tag bad">Not feasible</span>'} ${c.legal?'':`<span class="tag bad">Above your permitted ${S.v.legal} seats — needs approval</span>`} <span class="tag">${c.ab} seats across × ${c.rows} rows</span></p>${c.f.map(x=>`<div class="warn" style="border-color:var(--bad)">${x}</div>`).join('')}<div class="note">Min aisle, door and exit clearance are hard limits — never traded for one more seat. Red seats = do not fit.</div></div>
<div class="c"><table><tr><th>Measure</th><th>Value</th></tr><tr><td>Revenue capacity (all seats × avg fee)</td><td>${L(N*(e.stu?e.rev/e.stu:0))}/mo</td></tr><tr><td>Length used / available</td><td>${f1(c.need)} / ${f1(S.v.L)} m</td></tr><tr><td>Length remaining</td><td>${f1(S.v.L-c.need)} m</td></tr><tr><td>Passenger payload / allowance</td><td>${fmt(c.pay)} / ${fmt(c.cap)} kg</td></tr><tr><td>Bag space</td><td>${f1(N*S.v.bag)} m²</td></tr><tr><td>Aisle width (min ${S.v.aisle} m)</td><td>${f1(S.v.W-c.ab*S.v.seatW)} m</td></tr><tr><td>Seats currently filled (on the routes)</td><td>${f1(e.filled*100)}%</td></tr></table></div>
<div class="c"><h3>Is one more seat worth it?</h3><table><tr><th>Seats</th><th>Fits?</th><th>Extra revenue</th><th>Extra cost</th><th>Extra weight kg</th><th>Extra length m</th><th>Extra profit</th><th>Profit/hr change</th></tr>${E.map((x,i)=>{const p=i?E[i-1]:x,n=rg[i],a=chk(n),q=chk(n-1);return`<tr><td>${n}</td><td>${a.ok?'✓':'✗'}${a.legal?'':'⚠'}</td><td>${i?fmt(x.rev-p.rev):'—'}</td><td>${i?fmt(x.cost-p.cost):'—'}</td><td>${i?S.v.kg:'—'}</td><td>${i?f1(a.need-q.need):'—'}</td><td class="${cls(x.profit-p.profit)}">${i?fmt(x.profit-p.profit):'—'}</td><td>${i?fmt(x.ph-p.ph):'—'}</td></tr>`}).join('')}</table><p class="note">Extra revenue appears only when the extra seat lets you serve more students or fit more into the driving day. Otherwise the seat adds cost (fuel, upkeep) and no income.</p></div>
<div class="g2"><div class="c"><h3>Revenue / cost / profit vs seats</h3>${svgBar(rg,[{n:'Revenue',v:E.map(x=>x.rev),c:'#0f766e'},{n:'Cost',v:E.map(x=>x.cost),c:'#d97706'},{n:'Profit',v:E.map(x=>x.profit),c:'#2563eb'}])}</div><div class="c"><h3>Profit per vehicle-hour vs seats</h3>${svgBar(rg,[{n:'Profit/hr',v:E.map(x=>x.ph),c:'#7c3aed'}])}</div></div>`},
Scenarios(){const E=S.sc.map(n=>evalN(n)),b=evalN(S.v.seats),cur=S.v.seats,rows=[['Fits vehicle limits?',(n,x)=>chk(n).ok?'Yes':'No'],['Within your legal seats?',n=>n<=S.v.legal?'Yes':'No'],['Students served',(n,x)=>x.stu],['Monthly revenue',(n,x)=>fmt(x.rev)],['Monthly cost',(n,x)=>fmt(x.cost)],['Monthly profit',(n,x)=>fmt(x.profit)],['Profit per vehicle-hour',(n,x)=>fmt(x.ph)],['Driving hours/day',(n,x)=>f1(x.hrs)],['Seats filled',(n,x)=>f1(x.filled*100)+'%'],['Conversion cost',n=>fmt(Math.max(0,n-cur)*S.v.perSeat)],['Payback (estimate)',(n,x)=>n>cur&&x.profit>b.profit?f1(((n-cur)*S.v.perSeat)/(x.profit-b.profit))+' months':'—']];
return`<div class="c"><h3>Scenarios on the same students &amp; routes</h3><div class="note">No "best" score — compare the numbers. Edit seat counts in the header row.</div><table><tr><th></th>${S.sc.map((n,i)=>`<th><input data-c="${i}" type="number" value="${n}" style="width:70px"></th>`).join('')}</tr>${rows.map(r=>`<tr><td>${r[0]}</td>${S.sc.map((n,i)=>`<td>${r[1](n,E[i])}</td>`).join('')}</tr>`).join('')}</table></div><div class="c"><h3>Profit by scenario</h3>${svgBar(S.sc.map(n=>n+' seats'),[{n:'Profit',v:E.map(x=>x.profit),c:'#2563eb'}])}</div>`},
Economics(){const n=S.sel,b=evalN(S.v.seats),e=evalN(n),w=S.w,o={fee:w.fee,fuel:w.fuel||0,km:w.km},we=evalN(w.seats||n,o),P=e.profit,
T=[['Student fees ±10%',x=>evalN(n,{fee:x*10}).profit],['Fuel price ±10%',x=>evalN(n,{fuel:S.v.price*(1+x*.1)}).profit],['Number of students ±10%',x=>evalN(n,{stu:1+x*.1}).profit],['Daily distance ±10% (km)',x=>evalN(n,{km:e.km*x*.1}).profit],['Driver cost ±10%',x=>evalN(n,{drv:1+x*.1}).profit],['Maintenance ±10%',x=>evalN(n,{mt:1+x*.1}).profit],['Seats ±2',x=>evalN(n+2*x).profit]].map(t=>({n:t[0],a:t[1](-1)-P,c:t[1](1)-P})).sort((a,b)=>Math.max(Math.abs(b.a),Math.abs(b.c))-Math.max(Math.abs(a.a),Math.abs(a.c))),m=Math.max(1,...T.flatMap(t=>[Math.abs(t.a),Math.abs(t.c)])),
pb=(n-S.v.seats)*S.v.perSeat/(P-b.profit);
return`<div class="c"><h3>Break-even (at ${n} seats) <span class="note">estimate</span></h3><div class="g">${kpi('Fixed costs / month',L(e.fixed))}${kpi('Fuel per km',L(e.km?e.fuel/e.kmm:0),'variable cost')}${kpi('Average fee per student',L(e.stu?e.rev/e.stu:0))}${kpi('Break-even students',isFinite(e.be)?e.be:'—')}${kpi('Break-even revenue / month',L(e.beRev))}${kpi('Break-even driving hours/day',isFinite(e.beH)?f1(e.beH):'—')}${kpi('Conversion payback',P>b.profit&&n>S.v.seats?f1(pb)+' months':'—',`${L(Math.max(0,n-S.v.seats)*S.v.perSeat)} ÷ extra monthly profit (estimate)`)}</div><p>Proposed seats: <input data-p="sel" type="number" value="${n}" style="width:80px"></p></div>
<div class="c"><h3>What if…?</h3><div class="g">${inp('w.fee','Fee change (%)','e.g. -10 = LKR 18,000 instead of 20,000')}${inp('w.fuel','Fuel price (LKR/l, 0 = current)')}${inp('w.km','Extra km every day')}${inp('w.seats','Seats (0 = proposed)')}</div><p>Profit now (${S.v.seats} seats): <b>${L(b.profit)}</b> → what-if: <b class="${cls(we.profit)}">${L(we.profit)}</b> (<span class="${cls(we.profit-b.profit)}">${we.profit>=b.profit?'+':''}${fmt(we.profit-b.profit)}</span> / month)</p></div>
<div class="c"><h3>What matters most? <span class="note">change in monthly profit</span></h3><table>${T.map(t=>`<tr><td>${t.n}</td><td style="text-align:left"><div style="display:flex;align-items:center;gap:6px"><span class="${cls(t.a)}" style="width:80px;text-align:right">${fmt(t.a)}</span><div style="height:10px;width:${Math.abs(t.a)/m*120}px;background:${t.a>=0?'var(--ok)':'var(--bad)'}"></div><span class="${cls(t.c)}" style="width:80px">${fmt(t.c)}</span><div style="height:10px;width:${Math.abs(t.c)/m*120}px;background:${t.c>=0?'var(--ok)':'var(--bad)'}"></div></div></td></tr>`).join('')}</table><div class="note">Students ±10% changes revenue only; distances are kept as-is (approximation).</div></div>`}};
function R(){document.getElementById('nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};R()">${t}</button>`).join('');document.getElementById('app').innerHTML=views[TABS[tab]]()}
function addS(n){const l=S.students[S.students.length-1]||{area:areas()[0],school:schools()[0],fee:20000,am:'06:30',pm:'14:30',loc:''};for(let i=0;i<n;i++)S.students.push({...l,name:'New student',on:1});save();R()}
function ex(){document.getElementById('io').value=JSON.stringify(S)}
function im(){try{S=JSON.parse(document.getElementById('io').value);save();R()}catch(e){alert('Invalid data')}}
document.addEventListener('change',ev=>{const t=ev.target;let v=t.type=='checkbox'?(t.checked?1:0):t.value;
 if(t.dataset.p){const k=t.dataset.p.split('.'),l=k.pop(),o=k.reduce((a,x)=>a[x],S);o[l]=typeof o[l]=='number'?+v:v}
 else if(t.dataset.s){const[i,f]=t.dataset.s.split('.');S.students[i][f]=['fee','on'].includes(f)?+v:v}
 else if(t.dataset.areaI!=null)S.areas[t.dataset.areaI]=v;
 else if(t.dataset.schoolI!=null)S.schools[t.dataset.schoolI]=v;
 else if(t.dataset.dist){const[i,f]=t.dataset.dist.split('.');S.dist[i][f]=f=='km'?+v:v}
 else if(t.dataset.c)S.sc[t.dataset.c]=+v;else return;
 save();R()});
R();
</script></body></html>
